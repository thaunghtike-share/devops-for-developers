apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

replicas:
  - name: kustomize-demo-app
    count: 3

images:
  - name: nginx
    newTag: 1.28.0

patches:
  - path: patch-resources.yaml

configMapGenerator:
  - name: app-config
    envs:
      - config.properties

secretGenerator:
  - name: app-secret
    envs:
      - secret.env
    type: Opaque