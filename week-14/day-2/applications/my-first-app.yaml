apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-first-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:thaunghtike-share/gitops-lab.git
    targetRevision: main
    path: kube-manifests/first-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default